# 통합형 방송부 사이트 — 작업 순서 (위에서부터 하나씩, 스토리 하나 = bmad-build 한 세션 = PR 하나)
# [DB] 표시 스토리는 배포 승인 전에 관리자가 migrations 파일을 직접 실행해야 한다.

- id: "1"
  title: 메뉴 개편 (홈·대본·일정·게시판·알림)
  description: >-
    CAP-1. 상단 탭(넓은 화면)·하단 탭 막대(좁은 화면) 메뉴와 '내 이름' 계정 목록을 만들고, 대본 목록을 ?scripts로 옮기고 홈(/)은 빈 첫 화면 틀로 둔다.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    DB 변경 없음. ux-design.md 2절 기준. 게시판·알림 메뉴는 아직 기능이 없으므로 '곧 열려요' 빈 화면으로 둔다.
    기존 주소(?id=, ?new, ?calendar, ?help, ?accounts)가 그대로 열리는지 확인하고, 360px·1280px 폭 화면 캡처를 PR에 붙인다. 사용법 화면 갱신 포함.

- id: "2"
  title: 통합 첫 화면 (대시보드)
  description: >-
    CAP-2. GET /api/home으로 이번 주 방송·내 할 일·다가오는 일정 5개·(교사)검토 기다리는 대본을 첫 화면에 보여 준다; 공지 묶음은 자리만 두고 스토리 3에서 채운다.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    DB 변경 없음. ux-design.md 3절, architecture.md 4절. '내 대본' 판정은 isMyScript 함수 하나로 만든다.
    처음 온 학생 사용법 안내 띠를 홈으로 옮긴다.

- id: "3"
  title: "[DB] 공지·메모 게시판 + 공지 읽음 확인"
  description: >-
    CAP-3. 교사 공지(고정 최대 3개)·부원 메모 게시판과 학생 공지 읽음 기록, 교사의 읽음/안 읽음 명단을 만들고 첫 화면 '새 공지' 묶음과 할 일의 안 읽은 고정 공지를 채운다.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    DB 변경 있음: migrations/0006_board.sql + schema.sql (architecture.md 3절). PR 설명에 '배포 승인 전 관리자가 0006 실행'을 적는다.
    권한은 서버에서 확인. 학생 계정 삭제 시 post_reads 정리.

- id: "4"
  title: "[DB] 선생님 검토 댓글"
  description: >-
    CAP-4. 교사가 대본 구성별로 댓글을 남기고 학생이 '반영했어요'로 표시하며, 탭 배지·대본 목록·첫 화면 할 일에 반영 안 된 댓글 수를 보여 준다.
  done_checkpoint: true
  invoke_dev_with: >-
    DB 변경 있음: migrations/0007_review_comments.sql + schema.sql. PR 설명에 '배포 승인 전 관리자가 0007 실행'을 적는다.
    대본 삭제 batch에 댓글 삭제 추가. ux-design.md 5절.

- id: "5"
  title: "[DB] 알림 모아보기"
  description: >-
    CAP-5. notifications 표와 알림 화면·메뉴 배지를 만들고, 새 공지·검토 댓글·대본 완료·일정에 넣음·검토 요청이 생길 때 같은 batch로 알림을 남긴다.
  done_checkpoint: true
  invoke_dev_with: >-
    DB 변경 있음: migrations/0008_notifications.sql + schema.sql. PR 설명에 '배포 승인 전 관리자가 0008 실행'을 적는다.
    교사 알림은 recipient 'teacher'(공용). 90일 지난 알림 정리. ux-design.md 7절 표 기준.

- id: "6"
  title: 낭독 연습 모드
  description: >-
    CAP-6. ?practice=<id> 전체 화면에서 큰 글씨로 구성별로 넘기며 타이머로 재고, 끝에 구성별 실제/예상 시간을 비교한다; 2인 진행이면 내 대사를 강조한다.
  done_checkpoint: true
  invoke_dev_with: >-
    DB·API 변경 없음. ux-design.md 6절. formatSpeech·CHARS_PER_SECOND 재사용, 결과는 저장하지 않는다. Wake Lock은 지원할 때만.

- id: "7"
  title: 사자성어·계기교육 중복 방지
  description: >-
    CAP-7. 같은 학년도에 쓴 사자성어·계기교육 주제를 AI가 피하고 주제 고르는 화면에 '이미 씀(방송일)'을 표시하며, AI가 고른 주제도 choices에 기록한다.
  done_checkpoint: true
  invoke_dev_with: >-
    DB 변경 없음(choices JSON 사용). architecture.md 5절: schoolYearRange, '주제: …' 첫 줄 규칙, GET /api/topics/used.
    첫 줄 형식이 틀려도 대본 생성은 실패하지 않아야 한다.

- id: "8"
  title: "[DB] AI 사용량 제한 (학생 하루 30번)"
  description: >-
    CAP-8. 학생별 하루 AI 요청 수를 세어 한도(기본 30)를 넘으면 쉬운 말로 거절하고, AI 버튼 옆에 남은 횟수를 보여 준다; 교사는 제한 없음.
  done_checkpoint: true
  invoke_dev_with: >-
    DB 변경 있음: migrations/0009_ai_usage.sql + schema.sql, wrangler.jsonc vars에 AI_DAILY_LIMIT(공개 값) 추가. PR 설명에 '배포 승인 전 관리자가 0009 실행'을 적는다.
    원자적 증가(ON CONFLICT … WHERE count < 한도), Gemini 실패 시 1 되돌리기. architecture.md 3절.
