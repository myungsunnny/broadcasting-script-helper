# 배포: 변경 요청(PR)이 main에 합쳐지면 실행된다.
# 'production' 환경에 승인자를 정해 두면, 관리자가 [Approve and deploy]를 눌러야 실제 배포가 된다.
name: 배포

on:
  push:
    branches: [main]
  workflow_dispatch: # 필요하면 Actions 화면에서 직접 실행

# 배포가 겹치지 않게 한 번에 하나씩
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  check:
    name: 코드 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 자바스크립트 문법 검사
        run: |
          for f in src/*.js public/app.js; do
            node --check "$f"
          done
      - name: 서버 코드 묶기 시험
        run: npx wrangler deploy --dry-run --outdir dist

  deploy:
    name: Cloudflare에 배포
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://broadcasting-script-helper.myungsun-ma.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 배포
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
